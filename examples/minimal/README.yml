title: "Minimal OpenSearch Domain Example"
description: "Deploys a modest OpenSearch Service domain in an existing VPC using the wrapper module, with data sources for VPC and private subnets."
main_purpose: "Show a baseline end-to-end pattern—discover network context with data sources, call the wrapper with OpenSearch 2.19 on t3 instances, zone awareness, encryption, logging, a VPC endpoint, and a permissive demo access policy suitable for labs only."
key_features:
  - "**Data sources**: `data.aws_vpc.this` selects the VPC by `Name` tag derived from `local.common_name_prefix`; `data.aws_subnets.this` lists private subnets in that VPC (name pattern `${local.common_name_prefix}-private*`)."
  - "**Wrapper module**: `module.wrapper_opensearch` (source `../..`) receives `metadata` from locals and an `opensearch_parameters.example` map."
  - "**Cluster**: Engine `OpenSearch_2.19`, domain name from `lower(local.common_name_prefix)`, three `t3.small.search` data nodes, dedicated master disabled, coordinator nodes disabled, zone awareness with three availability zones."
  - "**Storage and Auto-Tune**: EBS `gp3` (30 GiB) with IOPS and throughput set; Auto-Tune `desired_state` is `DISABLED` (t3 families do not support Auto-Tune)."
  - "**Security and endpoint**: `domain_endpoint_options` enforce HTTPS and TLS 1.2 policy; `encrypt_at_rest` and `node_to_node_encryption` enabled; `advanced_security_options` includes internal user database and example master user (fine-grained access remains disabled in this example); example `security_group_rules` for ingress TCP 443 from the VPC CIDR."
  - "**VPC and endpoints**: `vpc_options.subnet_ids` uses `data.aws_subnets.this.ids`; `vpc_endpoints` defines an interface endpoint in those subnets (verify subnet attributes against the current wrapper—see parent README)."
  - "**Observability and lifecycle**: `log_publishing_options` for index slow logs, search slow logs, and ES application logs; `software_update_options` enables automatic software updates."
  - "**Access policy**: `access_policy_statements` with a wide-open `Allow` on `es:*` for demonstration—replace before any real use."
declared_resources:
  data_sources:
    - aws_vpc.this
    - aws_subnets.this
  modules:
    - wrapper_opensearch (path ../..)
  configuration_files:
    - providers.tf
    - metadata.tf
    - data_sources.tf
    - main.tf
